name: KeyMapper
options:
  bundleIdPrefix: com.app
  deploymentTarget:
    macOS: 13.0
targets:
  KeyMapper:
    type: application
    platform: macOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    settings:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_ENTITLEMENTS: KeyMapper.entitlements
      ENABLE_HARDENED_RUNTIME: NO
